name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: resolve CI image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: image
        run: |
          BASE="ghcr.io/ericjgoossen/achilles-ci"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_TAG="$BASE:pr-${{ github.event.pull_request.number }}"
            if docker manifest inspect "$PR_TAG" > /dev/null 2>&1; then
              echo "image=$PR_TAG" >> "$GITHUB_OUTPUT"
            else
              echo "No PR image found at $PR_TAG, falling back to :latest"
              echo "image=$BASE:latest" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "image=$BASE:latest" >> "$GITHUB_OUTPUT"
          fi
  format:
    name: clang-format
    needs: setup
    runs-on: ubuntu-latest
    container: ${{ needs.setup.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting (src/, include/)
        run: ./scripts/check-format.sh

  tidy:
    name: clang-tidy
    needs: setup
    runs-on: ubuntu-latest
    container: ${{ needs.setup.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -G Ninja

      - name: Check clang-tidy (src/, include/, tests/)
        run: ./scripts/check-tidy.sh build

  tidy-analyzer:
    name: clang-tidy (analyzer)
    needs: setup
    runs-on: ubuntu-latest
    container: ${{ needs.setup.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -G Ninja

      - name: Check clang-tidy analyzer checks (src/, include/, tests/)
        run: ./scripts/check-tidy-analyzer.sh build

  test:
    name: build & test
    needs: setup
    runs-on: ubuntu-latest
    container: ${{ needs.setup.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure